add_newline = true
format = '$directory$git_branch$git_status$python$rust$golang$java$docker_context$cmd_duration$line_break$character'

[directory]
format = '[\[](#585b70)[$path]($style)[\]](#585b70)[$read_only]($read_only_style)  '
style = 'bold #89b4fa'
read_only = ' read-only'
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = false

[git_branch]
format = '[$symbol$branch]($style) '
symbol = ' '
style = 'bold #cba6f7'

[git_status]
style = 'bold #f9e2af'

[python]
symbol = 'python '

[rust]
symbol = 'rust '

[golang]
symbol = 'go '

[java]
symbol = 'java '

[docker_context]
symbol = 'docker '

[character]
success_symbol = '[❯](bold #a6e3a1)'
error_symbol = '[❯](bold #f38ba8)'

[cmd_duration]
min_time = 2000
style = '#f9e2af'
